# Replaced with real ECR and service endpoints in the AWS deployment streams.
image:
  repository: replace-me.dkr.ecr.us-east-2.amazonaws.com/aero-backend
  tag: replace-me

api:
  replicas: 2
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true
    minAvailable: 1

worker:
  replicas: 1
