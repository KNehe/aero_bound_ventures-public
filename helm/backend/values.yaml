image:
  repository: aero-backend
  tag: local
  pullPolicy: IfNotPresent

api:
  replicas: 1
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 1
  resources: {}
  hpa:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: false
    minAvailable: 1

worker:
  replicas: 1

service:
  port: 80

ingress:
  enabled: false

secrets:
  existingSecretName: backend-secrets
  reloadOnChange: true
