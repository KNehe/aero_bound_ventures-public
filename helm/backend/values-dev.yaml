config:
  ENABLE_GUARD_AGENT: "false"
  REDIS_URL: redis://redis:6379
  REDIS_HOST: redis
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092

secrets:
  create: true
  existingSecretName: ""
  data:
    DATABASE_URL: postgresql://postgres:postgres@db:5432/postgres
    SECRET_KEY: local-development-only
    GUARD_API_KEY: local-development-only
    AMADEUS_API_KEY: local-development-only
    AMADEUS_API_SECRET: local-development-only
    MAIL_USERNAME: local@example.com
    MAIL_PASSWORD: local-development-only
    MAIL_FROM: local@example.com
