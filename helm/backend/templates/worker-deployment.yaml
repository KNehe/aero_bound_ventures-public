apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
  {{- if .Values.secrets.reloadOnChange }}
  annotations:
    secrets.doppler.com/reload: "true"
  {{- end }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-worker
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-worker
    spec:
      automountServiceAccountToken: false
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/backend/.venv/bin/python"]
          args: ["-m", "backend.worker"]
          envFrom:
            - secretRef:
                name: {{ required "secrets.existingSecretName is required" .Values.secrets.existingSecretName }}
          {{- with .Values.infrastructure.existingConfigMapName }}
          env:
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ . }}
                  key: REDIS_URL
          {{- end }}
