name: Deploy Backend to EKS Staging

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: backend-staging
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  AWS_STAGING_DEPLOY_ROLE_ARN: arn:aws:iam::245209218155:role/aero-backend-staging-github-deploy
  EKS_CLUSTER_NAME: aero-backend-staging
  ECR_REPOSITORY: aero-backend
  KUBERNETES_NAMESPACE: aero-staging
  ARGOCD_NAMESPACE: argocd
  STAGING_API_HOSTNAME: api-staging.aeroboundventures.com
  STAGING_GRAFANA_HOSTNAME: grafana-staging.aeroboundventures.com
  PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
  SECRET_KEY: ci-only-secret-key
  ALGORITHM: HS256
  ACCESS_TOKEN_EXPIRE_MINUTES: "60"
  GUARD_API_KEY: ci-only-guard-key
  GUARD_FAIL_SECURE: "false"
  ENABLE_GUARD_AGENT: "false"
  ENABLE_REDIS: "false"
  REDIS_URL: redis://127.0.0.1:6379
  KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9092
  MAIL_PORT: "587"
  MAIL_USERNAME: ci@example.com
  MAIL_PASSWORD: ci-only-password
  MAIL_FROM: ci@example.com
  MAIL_SERVER: localhost
  AMADEUS_API_KEY: ci-only-api-key
  AMADEUS_API_SECRET: ci-only-api-secret
  FLIGHT_SERVICE_PROVIDER: mock
  ENVIRONMENT: test
  CORS_ORIGINS: http://localhost:3000
  PASSIVE_MODE: "true"

jobs:
  deploy:
    name: Test, Build, and Deploy
    if: github.repository == 'KNehe/aero_bound_ventures'
    runs-on: ubuntu-latest
    environment: staging

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Run backend tests
        run: backend/.venv/bin/pytest backend/tests

      - name: Configure staging AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_STAGING_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-eks-staging

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve backend image
        id: image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          image_repository="${ECR_REGISTRY}/${ECR_REPOSITORY}"
          image_uri="${image_repository}:${GITHUB_SHA}"

          echo "repository=${image_repository}" >> "${GITHUB_OUTPUT}"
          echo "uri=${image_uri}" >> "${GITHUB_OUTPUT}"

          image_count="$(aws ecr batch-get-image \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids "imageTag=${GITHUB_SHA}" \
            --query 'length(images)' \
            --output text)"

          if [[ "${image_count}" == "1" ]]; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build backend image
        if: steps.image.outputs.exists != 'true'
        run: docker build --tag "${{ steps.image.outputs.uri }}" backend

      - name: Push backend image
        if: steps.image.outputs.exists != 'true'
        run: docker push "${{ steps.image.outputs.uri }}"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Configure staging kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}"

      - name: Verify Doppler-managed secret
        run: |
          kubectl --namespace "${KUBERNETES_NAMESPACE}" wait \
            --for=create secret/backend-secrets \
            --timeout=120s

      - name: Validate backend Helm chart
        run: |
          helm lint helm/backend --strict \
            -f helm/backend/values-staging.yaml \
            -f gitops/staging/values/backend.yaml \
            --set-string "image.repository=${{ steps.image.outputs.repository }}" \
            --set-string "image.tag=${GITHUB_SHA}"

          helm template aero-backend helm/backend \
            --namespace "${KUBERNETES_NAMESPACE}" \
            -f helm/backend/values-staging.yaml \
            -f gitops/staging/values/backend.yaml \
            --set-string "image.repository=${{ steps.image.outputs.repository }}" \
            --set-string "image.tag=${GITHUB_SHA}" >/dev/null

      - name: Promote backend image in Git
        id: promotion
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
        run: |
          git fetch origin main
          git switch --force-create gitops-promotion origin/main

          values_file=gitops/staging/values/backend.yaml
          sed -i \
            -e "s|^  repository: .*|  repository: ${IMAGE_REPOSITORY}|" \
            -e "s|^  tag: .*|  tag: ${GITHUB_SHA}|" \
            "${values_file}"

          git add "${values_file}"
          if git diff --cached --quiet; then
            echo "The staging desired state already references ${GITHUB_SHA}."
            echo "revision=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore(gitops): deploy backend ${GITHUB_SHA::12} [skip ci]"
          git push origin HEAD:main
          echo "revision=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Wait for Argo CD reconciliation
        env:
          DESIRED_REVISION: ${{ steps.promotion.outputs.revision }}
        run: |
          reconciliation_deadline=$((SECONDS + 600))
          reconciled=false

          while (( SECONDS < reconciliation_deadline )); do
            application_status="$(kubectl --namespace "${ARGOCD_NAMESPACE}" \
              get application/aero-staging-backend \
              --output jsonpath='{.status.sync.status}{"|"}{.status.health.status}{"|"}{.status.sync.revisions}')"
            IFS='|' read -r sync_status health_status revisions <<< "${application_status}"

            echo "Argo CD status: sync=${sync_status} health=${health_status} revisions=${revisions}"

            if [[ "${sync_status}" == "Synced" && \
                  "${health_status}" == "Healthy" && \
                  "${revisions}" == *"${DESIRED_REVISION}"* ]]; then
              reconciled=true
              break
            fi

            sleep 10
          done

          if [[ "${reconciled}" != "true" ]]; then
            echo "Argo CD did not reconcile revision ${DESIRED_REVISION} within 10 minutes." >&2
            exit 1
          fi

      - name: Diagnose failed deployment
        if: failure()
        run: |
          kubectl --namespace "${ARGOCD_NAMESPACE}" \
            get applications --output wide || true

          kubectl --namespace "${ARGOCD_NAMESPACE}" \
            describe application/aero-staging-backend || true

          kubectl --namespace "${KUBERNETES_NAMESPACE}" \
            get deployments,pods \
            --output wide || true

          kubectl --namespace "${KUBERNETES_NAMESPACE}" \
            describe deployment/aero-backend-api || true

          kubectl --namespace "${KUBERNETES_NAMESPACE}" \
            describe pods \
            --selector app=aero-backend-api || true

          kubectl --namespace "${KUBERNETES_NAMESPACE}" \
            get ingress/aero-backend-api \
            --output wide || true

          kubectl --namespace "${KUBERNETES_NAMESPACE}" \
            describe ingress/aero-backend-api || true

          kubectl --namespace "${KUBERNETES_NAMESPACE}" \
            logs \
            --selector app=aero-backend-api \
            --all-containers=true \
            --prefix=true \
            --tail=200 \
            --max-log-requests=10 || true

          kubectl --namespace "${KUBERNETES_NAMESPACE}" \
            describe job/aero-backend-migration || true

          kubectl --namespace "${KUBERNETES_NAMESPACE}" \
            get pods \
            --selector job-name=aero-backend-migration \
            --output wide || true

          kubectl --namespace "${KUBERNETES_NAMESPACE}" \
            logs \
            --selector job-name=aero-backend-migration \
            --all-containers=true \
            --prefix=true \
            --tail=-1 \
            --max-log-requests=10 || true

          kubectl --namespace "${KUBERNETES_NAMESPACE}" \
            get events \
            --sort-by=.lastTimestamp || true

      - name: Verify backend rollouts
        run: |
          kubectl --namespace "${KUBERNETES_NAMESPACE}" rollout status \
            deployment/aero-backend-api --timeout=180s
          kubectl --namespace "${KUBERNETES_NAMESPACE}" rollout status \
            deployment/aero-backend-worker --timeout=180s

      - name: Smoke test backend
        run: |
          ingress_name=aero-backend-api
          alb_hostname=""

          for attempt in {1..60}; do
            alb_hostname="$(kubectl --namespace "${KUBERNETES_NAMESPACE}" \
              get "ingress/${ingress_name}" \
              --output jsonpath='{.status.loadBalancer.ingress[0].hostname}' \
              2>/dev/null || true)"

            if [[ -n "${alb_hostname}" ]]; then
              break
            fi

            if [[ "${attempt}" == "60" ]]; then
              kubectl --namespace "${KUBERNETES_NAMESPACE}" \
                describe "ingress/${ingress_name}"
              echo "Ingress did not receive an ALB hostname within 10 minutes." >&2
              exit 1
            fi

            sleep 10
          done

          shared_alb_enabled="$(kubectl --namespace "${KUBERNETES_NAMESPACE}" \
            get configmap/backend-infrastructure \
            --output jsonpath='{.data.STAGING_SHARED_ALB_ENABLED}' \
            2>/dev/null || true)"
          shared_alb_enabled="${shared_alb_enabled:-false}"

          echo "### Staging DNS" >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${shared_alb_enabled}" == "true" ]]; then
            echo "Point both staging hostnames to the shared ALB:" >> "${GITHUB_STEP_SUMMARY}"
            echo "\`${STAGING_API_HOSTNAME}\` \`CNAME\` \`${alb_hostname}\`" >> "${GITHUB_STEP_SUMMARY}"
            echo "\`${STAGING_GRAFANA_HOSTNAME}\` \`CNAME\` \`${alb_hostname}\`" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "The combined certificate is pending; keep the existing API CNAME unchanged." >> "${GITHUB_STEP_SUMMARY}"
          fi

          endpoint=""
          https_enabled="$(kubectl --namespace "${KUBERNETES_NAMESPACE}" \
            get configmap/backend-infrastructure \
            --output jsonpath='{.data.STAGING_HTTPS_ENABLED}' \
            2>/dev/null || true)"
          https_enabled="${https_enabled:-false}"

          for attempt in {1..60}; do
            if [[ "${https_enabled}" == "true" ]]; then
              if curl --fail --silent \
                --connect-timeout 3 \
                --max-time 5 \
                --connect-to "${STAGING_API_HOSTNAME}:443:${alb_hostname}:443" \
                "https://${STAGING_API_HOSTNAME}/live" >/dev/null 2>&1; then
                curl --fail --silent --show-error \
                  --connect-timeout 3 \
                  --max-time 5 \
                  --connect-to "${STAGING_API_HOSTNAME}:443:${alb_hostname}:443" \
                  "https://${STAGING_API_HOSTNAME}/ready"
                endpoint="https://${STAGING_API_HOSTNAME}"
                break
              fi
            elif curl --fail --silent \
              --connect-timeout 3 \
              --max-time 5 \
              --header "Host: ${STAGING_API_HOSTNAME}" \
              "http://${alb_hostname}/live" >/dev/null 2>&1; then
              curl --fail --silent --show-error \
                --connect-timeout 3 \
                --max-time 5 \
                --header "Host: ${STAGING_API_HOSTNAME}" \
                "http://${alb_hostname}/ready"
              endpoint="http://${alb_hostname} (HTTPS pending)"
              break
            fi

            if [[ "${attempt}" == "60" ]]; then
              echo "ALB targets did not become healthy within 10 minutes." >&2
              exit 1
            fi

            sleep 5
          done

          echo "### Staging ALB" >> "${GITHUB_STEP_SUMMARY}"
          echo "${endpoint}" >> "${GITHUB_STEP_SUMMARY}"
