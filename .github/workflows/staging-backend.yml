name: Staging Backend Pipeline

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "gitops/**"
      - "helm/backend/**"
      - "helm/monitoring/**"
      - ".github/scripts/validate-gitops.sh"
      - ".github/workflows/deploy-backend-staging.yml"
      - ".github/workflows/terraform-kubernetes-staging.yml"
      - ".github/workflows/staging-backend.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "gitops/**"
      - "helm/**"
      - "terraform/kubernetes-staging/**"
      - ".github/scripts/validate-gitops.sh"
      - ".github/workflows/deploy-backend-staging.yml"
      - ".github/workflows/terraform-kubernetes-staging.yml"
      - ".github/workflows/staging-backend.yml"

permissions:
  contents: write
  id-token: write

concurrency:
  group: staging-backend-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Helm and Argo CD desired state
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Validate pinned Argo CD chart
        run: |
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update argo
          helm template argocd argo/argo-cd \
            --version 10.2.1 \
            --namespace argocd \
            --values gitops/bootstrap/argocd-values.yaml >/dev/null

      - name: Validate GitOps contract
        run: bash .github/scripts/validate-gitops.sh

  infrastructure:
    name: Provision infrastructure
    needs: validate
    if: github.event_name != 'pull_request' && github.repository == 'KNehe/aero_bound_ventures'
    uses: ./.github/workflows/terraform-kubernetes-staging.yml
    with:
      operation: apply
    secrets: inherit

  deployment:
    name: Deploy backend
    needs: infrastructure
    uses: ./.github/workflows/deploy-backend-staging.yml
    secrets: inherit
