apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aero-staging-backend-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: aero-staging
  sources:
    - repoURL: git@github.com:KNehe/aero_bound_ventures.git
      targetRevision: main
      path: helm/backend-secrets
      helm:
        releaseName: aero-backend-secrets
        valueFiles:
          - $values/gitops/staging/values/backend-secrets.yaml
    - repoURL: git@github.com:KNehe/aero_bound_ventures.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: doppler-operator-system
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
