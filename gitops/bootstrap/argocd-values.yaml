server:
  service:
    type: ClusterIP

configs:
  params:
    server.insecure: true
  cm:
    resource.customizations.health.argoproj.io_Application: |
      health = {
        status = "Progressing",
        message = "Waiting for the child Application to synchronize"
      }
      if obj.status ~= nil then
        if obj.status.operationState ~= nil and
           (obj.status.operationState.phase == "Error" or
            obj.status.operationState.phase == "Failed") then
          health.status = "Degraded"
          health.message = obj.status.operationState.message or
            "Child Application synchronization failed"
        elseif obj.status.sync ~= nil and obj.status.sync.status == "Synced" then
          health.status = "Healthy"
          health.message = "Child Application is synced"
        elseif obj.status.sync ~= nil then
          health.message = "Child Application sync status: " ..
            (obj.status.sync.status or "Unknown")
        end
      end
      return health
    resource.customizations.health.secrets.doppler.com_DopplerSecret: |
      health = {
        status = "Progressing",
        message = "Waiting for Doppler to synchronize the managed Secret"
      }
      if obj.status ~= nil and obj.status.conditions ~= nil then
        for _, condition in ipairs(obj.status.conditions) do
          if condition.type == "SecretSyncReady" then
            health.message = condition.message or condition.reason or ""
            if condition.status == "True" then
              health.status = "Healthy"
            elseif condition.status == "False" then
              health.status = "Degraded"
            end
            return health
          end
        end
      end
      return health

dex:
  enabled: false

notifications:
  enabled: false

redis-ha:
  enabled: false
