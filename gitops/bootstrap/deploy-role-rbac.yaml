apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: staging-deploy-argocd-reader
  namespace: argocd
rules:
  - apiGroups:
      - argoproj.io
    resources:
      - applications
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: staging-deploy-argocd-reader
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: staging-deploy-argocd-reader
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: aero-staging-deploy
